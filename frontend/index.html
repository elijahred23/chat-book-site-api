<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Hub</title>
    <style>
      .bn-pronunciation-toggle,
      .bn-breakdown-speech-control {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.55rem;
        margin: 0.75rem 0;
        color: #334155;
        font-size: 0.9rem;
        font-weight: 700;
      }
      .bn-pronunciation-toggle input {
        width: 1.05rem;
        height: 1.05rem;
        accent-color: #2563eb;
      }
      .bn-breakdown-speech-control select {
        min-height: 2.5rem;
        padding: 0.45rem 0.7rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.65rem;
        background: #fff;
        color: #0f172a;
        font: inherit;
      }
      .bengali-breakdown__completed-glyph > strong[lang="bn"] {
        cursor: pointer;
        border-radius: 0.5rem;
      }
      .bengali-breakdown__completed-glyph > strong[lang="bn"]:focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 4px;
      }
      .bn-pronunciations-hidden .bn-pronunciation,
      .bn-pronunciations-hidden .bn-loop-breakdown__word > strong,
      .bn-pronunciations-hidden .bn-word-loop strong[lang="bn"] + strong,
      .bn-pronunciations-hidden [aria-labelledby="bengali-translator-title"] [lang="bn"] + div,
      .bn-pronunciations-hidden [aria-labelledby="bengali-translator-title"] [lang="bn"] + span {
        display: none !important;
      }
      .bn-pronunciations-hidden [data-bn-game-display] {
        font-size: 0 !important;
      }
      .bn-pronunciations-hidden [data-bn-game-display]::after {
        content: attr(data-bn-game-display);
        font-size: 1rem;
      }
      .bn-pronunciations-hidden .bn-game-prompt[data-bn-game-display]::after {
        font-size: 1.25rem;
      }
      .bn-pronunciations-hidden .bn-game-subtext[data-bn-game-display]::after {
        font-size: 0.95rem;
      }
      .bn-pronunciations-hidden .bn-memory-card[data-bn-game-display]::after,
      .bn-pronunciations-hidden .bn-bingo-card small[data-bn-game-display]::after {
        font-size: 0.85rem;
      }
      .bn-pronunciations-hidden .bn-game-option .bn-option-index {
        font-size: 0.76rem;
      }
      @media (max-width: 640px) {
        .bn-pronunciation-toggle,
        .bn-breakdown-speech-control {
          justify-content: space-between;
          padding: 0 0.75rem;
        }
        .bn-breakdown-speech-control select {
          min-width: 0;
          max-width: 58vw;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const STORAGE_KEY = "bengali_tutor_show_pronunciations";
        const BREAKDOWN_SPEECH_KEY = "bn_breakdown_speech_source";
        const originalText = new WeakMap();
        let applying = false;
        let activeGoogleAudio = null;

        const getPreference = () => {
          try {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored === null ? true : stored === "true";
          } catch {
            return true;
          }
        };

        const savePreference = (value) => {
          try {
            localStorage.setItem(STORAGE_KEY, String(value));
          } catch {
            // The toggle still works for the current session.
          }
        };

        const getBreakdownSpeechSource = () => {
          try {
            return localStorage.getItem(BREAKDOWN_SPEECH_KEY) === "system" ? "system" : "google";
          } catch {
            return "google";
          }
        };

        const saveBreakdownSpeechSource = (value) => {
          try {
            localStorage.setItem(BREAKDOWN_SPEECH_KEY, value);
          } catch {
            // The selected source still works for the current session.
          }
        };

        const speakWithSystemVoice = (text) => {
          if (!window.speechSynthesis) throw new Error("System speech synthesis is unavailable.");
          const utterance = new SpeechSynthesisUtterance(text);
          const bengaliVoice = window.speechSynthesis.getVoices().find((voice) => /^bn/i.test(voice.lang));
          utterance.lang = bengaliVoice?.lang || "bn-IN";
          if (bengaliVoice) utterance.voice = bengaliVoice;
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utterance);
        };

        const speakWithGoogle = async (text) => {
          window.speechSynthesis?.cancel();
          activeGoogleAudio?.pause();
          const response = await fetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, lang: "bn-IN" })
          });
          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.error || `Google speech failed (${response.status}).`);
          }
          const audioUrl = URL.createObjectURL(await response.blob());
          const audio = new Audio(audioUrl);
          activeGoogleAudio = audio;
          const release = () => {
            URL.revokeObjectURL(audioUrl);
            if (activeGoogleAudio === audio) activeGoogleAudio = null;
          };
          audio.addEventListener("ended", release, { once: true });
          audio.addEventListener("error", release, { once: true });
          try {
            await audio.play();
          } catch (error) {
            release();
            throw error;
          }
        };

        const speakBreakdownWord = async (text) => {
          const spokenText = text?.trim();
          if (!spokenText) return;
          const source = getBreakdownSpeechSource();
          try {
            if (source === "google") await speakWithGoogle(spokenText);
            else speakWithSystemVoice(spokenText);
          } catch (error) {
            console.error("Bengali breakdown speech error:", error);
            if (source === "google") {
              try {
                speakWithSystemVoice(spokenText);
              } catch (fallbackError) {
                console.error("Bengali system speech fallback error:", fallbackError);
              }
            }
          }
        };

        const pronunciationTextTargets = (main) => main.querySelectorAll(
          ".bn-word-loop select option"
        );

        const gameTextTargets = (main) => main.querySelectorAll([
          ".bn-game-prompt",
          ".bn-game-option",
          ".bn-game-feedback",
          ".bn-memory-card",
          ".bn-game-subtext[lang=\"bn\"]",
          ".bn-bingo-card small"
        ].join(","));

        const setTextIfChanged = (node, value) => {
          if (node.textContent !== value) node.textContent = value;
        };

        const hideEmbeddedPronunciation = (element) => {
          if (!originalText.has(element)) originalText.set(element, element.textContent);
          const value = originalText.get(element) || "";
          if (element.matches(".bn-word-loop select option") && value.includes(" · ")) {
            setTextIfChanged(element, value.replace(/^(\s*\d+\.\s*).*?\s+·\s+/, "$1"));
            return;
          }
          setTextIfChanged(element, value.replace(/\s*\([^()]*\)/g, "").replace(/\s{2,}/g, " ").trim());
        };

        const restoreEmbeddedPronunciation = (element) => {
          if (originalText.has(element)) setTextIfChanged(element, originalText.get(element));
        };

        const gameTextValue = (element) => {
          const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
          const parts = [];
          while (walker.nextNode()) {
            const node = walker.currentNode;
            if (node.parentElement?.closest(".bn-option-index")) continue;
            parts.push(node.nodeValue || "");
          }
          return parts.join(" ").replace(/\s+/g, " ").trim();
        };

        const updateGameDisplay = (element, showPronunciations) => {
          if (showPronunciations) {
            element.removeAttribute("data-bn-game-display");
            return;
          }
          const display = gameTextValue(element)
            .replace(/\s*\([^()]*\)/g, "")
            .replace(/\s{2,}/g, " ")
            .trim();
          element.setAttribute("data-bn-game-display", display);
        };

        const handlePronunciationGame = (main, showPronunciations) => {
          const gameSelect = [...main.querySelectorAll("select")]
            .find((select) => [...select.options].some((option) => option.value === "pronunciation"));
          if (!gameSelect) return;
          const pronunciationOption = [...gameSelect.options].find((option) => option.value === "pronunciation");
          pronunciationOption.disabled = !showPronunciations;
          pronunciationOption.hidden = !showPronunciations;
          if (!showPronunciations && gameSelect.value === "pronunciation") {
            gameSelect.value = "match";
            gameSelect.dispatchEvent(new Event("change", { bubbles: true }));
          }
        };

        const applyPreference = (main, showPronunciations) => {
          if (applying) return;
          applying = true;
          main.classList.toggle("bn-pronunciations-hidden", !showPronunciations);
          pronunciationTextTargets(main).forEach((element) => {
            if (showPronunciations) restoreEmbeddedPronunciation(element);
            else hideEmbeddedPronunciation(element);
          });
          gameTextTargets(main).forEach((element) => updateGameDisplay(element, showPronunciations));
          handlePronunciationGame(main, showPronunciations);
          applying = false;
        };

        const installBreakdownSpeechControl = () => {
          const breakdown = document.querySelector(".bengali-breakdown");
          if (!breakdown) return;

          breakdown.querySelectorAll('.bengali-breakdown__completed-glyph > strong[lang="bn"]').forEach((word) => {
            word.classList.add("bn-breakdown-speakable");
            word.setAttribute("role", "button");
            word.setAttribute("tabindex", "0");
            word.setAttribute("title", "Click to hear this Bangla word");
            word.setAttribute("aria-label", `Hear ${word.textContent.trim()}`);
          });

          if (breakdown.querySelector(".bn-breakdown-speech-control")) return;
          const tabs = breakdown.querySelector(".bengali-breakdown__tabs");
          const label = document.createElement("label");
          label.className = "bn-breakdown-speech-control";
          const text = document.createElement("span");
          text.textContent = "Bangla word voice";
          const select = document.createElement("select");
          select.setAttribute("aria-label", "Bangla word voice in character breakdown");
          select.innerHTML = [
            '<option value="google">Google Text-to-Speech</option>',
            '<option value="system">System default</option>'
          ].join("");
          select.value = getBreakdownSpeechSource();
          select.addEventListener("change", () => saveBreakdownSpeechSource(select.value));
          label.append(text, select);
          if (tabs) tabs.insertAdjacentElement("afterend", label);
          else breakdown.prepend(label);
        };

        const installToggle = () => {
          const nav = document.querySelector('nav[aria-label="Bengali tutor sections"]');
          if (!nav) return;
          const main = nav.closest("main");
          if (!main) return;
          main.querySelector(".bn-breakdown-speech-control")?.remove();
          if (nav.dataset.pronunciationToggleReady === "true") return;
          nav.dataset.pronunciationToggleReady = "true";

          const label = document.createElement("label");
          label.className = "bn-pronunciation-toggle";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = getPreference();
          checkbox.setAttribute("aria-label", "Show Bengali pronunciations");
          const text = document.createElement("span");
          text.textContent = "Show pronunciations";
          label.append(checkbox, text);
          nav.insertAdjacentElement("afterend", label);

          checkbox.addEventListener("change", () => {
            savePreference(checkbox.checked);
            applyPreference(main, checkbox.checked);
          });
          applyPreference(main, checkbox.checked);
        };

        document.addEventListener("click", (event) => {
          const target = event.target.closest?.('.bengali-breakdown .bn-breakdown-speakable');
          if (!target) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          speakBreakdownWord(target.textContent);
        }, true);

        document.addEventListener("keydown", (event) => {
          const target = event.target.closest?.('.bengali-breakdown .bn-breakdown-speakable');
          if (!target || (event.key !== "Enter" && event.key !== " ")) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          speakBreakdownWord(target.textContent);
        }, true);

        const observer = new MutationObserver(() => {
          installToggle();
          installBreakdownSpeechControl();
          const nav = document.querySelector('nav[aria-label="Bengali tutor sections"]');
          const main = nav?.closest("main");
          const checkbox = main?.querySelector(".bn-pronunciation-toggle input");
          if (main && checkbox) applyPreference(main, checkbox.checked);
        });

        observer.observe(document.documentElement, {
          childList: true,
          characterData: true,
          subtree: true
        });
        installToggle();
        installBreakdownSpeechControl();
      })();
    </script>
  </body>
</html>
